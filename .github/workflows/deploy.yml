name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH (Deploy-Key)
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 212.227.39.26 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy code to server (rsync)
        run: |
          rsync -avz --delete --no-o --no-g \
            -e "ssh -i ~/.ssh/deploy_key" \
            --exclude '.git' \
            --exclude '.venv' \
            --exclude 'db.sqlite3' \
            --exclude 'media' \
            --exclude 'staticfiles' \
            --exclude '.env' \
            ./ root@212.227.39.26:/opt/bal/

      - name: Run deploy script on server
        run: |
          ssh -i ~/.ssh/deploy_key root@212.227.39.26 \
            'bash /opt/bal/deploy.sh'

name: Bootstrap
on:
  workflow_dispatch:

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH (Deploy-Key)
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Try connect with deploy key, restore admin key
        run: |
          set +e
          ssh -vv -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/dev/null \
            root@212.227.39.26 'grep -q "rameen@Ramin.local" ~/.ssh/authorized_keys || echo "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILk1bGE/RwRA7RZuhHr5m4GPDOkMXOGMW2bCWN9MnfDl rameen@Ramin.local" >> ~/.ssh/authorized_keys; echo BOOTSTRAP_OK; cat ~/.ssh/authorized_keys' \
            > ssh_verbose.log 2>&1
          echo "exit=$?"
          cat ssh_verbose.log | head -60
          echo "BOOTSTRAP_DONE"

      - name: Upload SSH verbose log
        uses: actions/upload-artifact@v4
        with:
          name: ssh-log
          path: ssh_verbose.log
          if-no-files-found: ignore

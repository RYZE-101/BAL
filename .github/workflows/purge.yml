name: Purge-Bots (TEMPORÄR – nach Gebrauch löschen)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run (nur anzeigen) oder delete (wirklich löschen)"
        type: choice
        options: [dry-run, delete]
        default: dry-run
      prefixes:
        description: "Zusätzliche Username-Präfixe, kommagetrennt (z.B. probe_,verify_)"
        type: string
        default: ""

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: SSH-Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 212.227.39.26 >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Purge auf Server ausführen
        run: |
          ARGS=""
          [ "${{ inputs.mode }}" = "delete" ] && ARGS="--delete"
          for p in $(echo "${{ inputs.prefixes }}" | tr ',' ' '); do
            [ -n "$p" ] && ARGS="$ARGS --prefix $p"
          done
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/dev/null \
            root@212.227.39.26 \
            "su -s /bin/bash www-data -c 'cd /opt/bal && .venv/bin/python manage.py purge_bot_accounts $ARGS'"

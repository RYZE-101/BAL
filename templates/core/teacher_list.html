{% extends 'base.html' %}
{% block title %}Lehrkräfte – BAL{% endblock %}
{% block content %}
<div class="container section">
    <div class="section-head">
        <h1 class="section-title">Alle Lehrkräfte</h1>
        <div class="teacher-controls">
            <div class="search-field">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input type="search" id="teacher-q" placeholder="Lehrkraft suchen…" value="{{ request.GET.q|default:'' }}" autocomplete="off">
            </div>
            <select id="teacher-subject" aria-label="Nach Fach filtern">
                <option value="">Alle Fächer</option>
                {% for s in subjects %}
                    <option value="{{ s.id }}" {% if s.id|stringformat:"s" in selected_subjects %}selected{% endif %}>{{ s.name }}</option>
                {% endfor %}
            </select>
        </div>
    </div>
    <div id="teacher-grid-container" data-url="{% url 'teacher_list_partial' %}">
        {% include 'core/_teacher_grid.html' %}
    </div>
</div>
{% endblock %}
